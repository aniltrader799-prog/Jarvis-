name: Build Jarvis

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Create Flutter project
        run: flutter create --org com.example --project-name jarvis --platforms android .

      - name: Update Gradle version
        run: |
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Write android/settings.gradle
        run: |
          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.3.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.24" apply false
          }

          include ":app"
          EOF

      - name: Write android/build.gradle
        run: |
          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

      - name: Fix aapt2 bug in gradle.properties
        run: echo "android.aapt2Version=8.6.1-11315950" >> android/gradle.properties

      - name: Write android/app/build.gradle
        run: |
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) {
              flutterVersionCode = '1'
          }

          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) {
              flutterVersionName = '1.0'
          }

          android {
              namespace "com.example.jarvis"
              compileSdk 36
              ndkVersion "27.0.12077973"

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  applicationId "com.example.jarvis"
                  minSdkVersion 24
                  targetSdkVersion 34
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }

          flutter {
              source '../..'
          }
          EOF

      - name: Write pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: jarvis
          description: Voice-controlled Android automation
          publish_to: 'none'
          version: 0.1.0

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
            flutter_secure_storage: ^9.2.2
            flutter_tts: 4.0.2
            speech_to_text: 7.0.0

          dependency_overrides:
            speech_to_text: 7.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Write Android manifest and resources
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/jarvis
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService"/>
                  </intent>
              </queries>
              <application
                  android:label="Jarvis"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2"/>
                  <service
                      android:name=".JarvisAccessibilityService"
                      android:exported="true"
                      android:label="Jarvis"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>
                  </service>
              </application>
          </manifest>
          EOF
          cat << 'EOF' > android/app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:description="@string/jarvis_a11y_desc"
              android:notificationTimeout="100" />
          EOF
          cat << 'EOF' > android/app/src/main/res/values/jarvis_strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="jarvis_a11y_desc">Jarvis screen automation</string>
          </resources>
          EOF

      - name: Write Kotlin native code
        run: |
          cat << 'EOF' > android/app/src/main/kotlin/com/example/jarvis/JarvisAccessibilityService.kt
          package com.example.jarvis

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Bitmap
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Build
          import android.os.Bundle
          import android.util.Base64
          import android.view.Display
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream

          class JarvisAccessibilityService : AccessibilityService() {
              companion object {
                  @Volatile var instance: JarvisAccessibilityService? = null
                  @Volatile var killed: Boolean = false
              }

              private val nodes = ArrayList<AccessibilityNodeInfo>()

              override fun onServiceConnected() {
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onDestroy() {
                  instance = null
                  super.onDestroy()
              }

              fun uiTree(): String {
                  nodes.clear()
                  val arr = JSONArray()
                  val root = rootInActiveWindow ?: return "[]"
                  walk(root, arr)
                  return arr.toString()
              }

              private fun walk(n: AccessibilityNodeInfo, arr: JSONArray) {
                  if (arr.length() >= 120) return
                  val text = n.text?.toString() ?: n.contentDescription?.toString() ?: ""
                  if (text.isNotEmpty() || n.isClickable || n.isEditable) {
                      val r = Rect()
                      n.getBoundsInScreen(r)
                      val o = JSONObject()
                      o.put("i", nodes.size)
                      o.put("text", if (text.length > 60) text.substring(0, 60) else text)
                      o.put("click", n.isClickable)
                      o.put("edit", n.isEditable)
                      o.put("cx", r.centerX())
                      o.put("cy", r.centerY())
                      arr.put(o)
                      nodes.add(n)
                  }
                  for (i in 0 until n.childCount) {
                      val c = n.getChild(i) ?: continue
                      walk(c, arr)
                  }
              }

              fun gesture(x1: Float, y1: Float, x2: Float, y2: Float, dur: Long): Boolean {
                  val p = Path()
                  p.moveTo(x1, y1)
                  if (x1 != x2 || y1 != y2) p.lineTo(x2, y2)
                  val stroke = GestureDescription.StrokeDescription(p, 0L, if (dur < 1L) 1L else dur)
                  val g = GestureDescription.Builder().addStroke(stroke).build()
                  return dispatchGesture(g, null, null)
              }

              fun tapNode(idx: Int): Boolean {
                  if (idx < 0 || idx >= nodes.size) return false
                  val n = nodes[idx]
                  var cur: AccessibilityNodeInfo? = n
                  while (cur != null) {
                      if (cur.isClickable && cur.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true
                      cur = cur.parent
                  }
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  return gesture(r.centerX().toFloat(), r.centerY().toFloat(),
                      r.centerX().toFloat(), r.centerY().toFloat(), 50L)
              }

              fun typeText(t: String, idx: Int): Boolean {
                  val node: AccessibilityNodeInfo? =
                      if (idx >= 0 && idx < nodes.size) nodes[idx]
                      else rootInActiveWindow?.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                  if (node == null) return false
                  val b = Bundle()
                  b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, t)
                  return node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b)
              }

              fun screenshot(cb: (Map<String, Any>?) -> Unit) {
                  if (Build.VERSION.SDK_INT < 30) {
                      cb(null)
                      return
                  }
                  takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor,
                      object : AccessibilityService.TakeScreenshotCallback {
                          override fun onSuccess(r: AccessibilityService.ScreenshotResult) {
                              try {
                                  val hw = Bitmap.wrapHardwareBuffer(r.hardwareBuffer, r.colorSpace)
                                  val bmp = hw?.copy(Bitmap.Config.ARGB_8888, false)
                                  r.hardwareBuffer.close()
                                  if (bmp == null) {
                                      cb(null)
                                      return
                                  }
                                  val w = 540
                                  val h = bmp.height * w / bmp.width
                                  val sm = Bitmap.createScaledBitmap(bmp, w, h, true)
                                  val bos = ByteArrayOutputStream()
                                  sm.compress(Bitmap.CompressFormat.JPEG, 60, bos)
                                  val dm = resources.displayMetrics
                                  cb(mapOf(
                                      "base64" to Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP),
                                      "imageWidth" to w,
                                      "imageHeight" to h,
                                      "screenWidth" to dm.widthPixels,
                                      "screenHeight" to dm.heightPixels
                                  ))
                              } catch (e: Exception) {
                                  cb(null)
                              }
                          }

                          override fun onFailure(errorCode: Int) {
                              cb(null)
                          }
                      })
              }
          }
          EOF
          cat << 'EOF' > android/app/src/main/kotlin/com/example/jarvis/MainActivity.kt
          package com.example.jarvis

          import android.content.Intent
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "jarvis/native")
                      .setMethodCallHandler { call, result ->
                          val s = JarvisAccessibilityService.instance
                          when (call.method) {
                              "getUiTree" -> result.success(s?.uiTree() ?: "[]")
                              "captureScreenshot" -> {
                                  if (s == null) {
                                      result.error("NO_SERVICE", "Accessibility service is off", null)
                                  } else {
                                      s.screenshot { m ->
                                          if (m == null) result.error("FAIL", "Screenshot failed", null)
                                          else result.success(m)
                                      }
                                  }
                              }
                              "tap" -> {
                                  val x = (call.argument<Double>("x") ?: 0.0).toFloat()
                                  val y = (call.argument<Double>("y") ?: 0.0).toFloat()
                                  result.success(s?.gesture(x, y, x, y, 50L) ?: false)
                              }
                              "tapNode" -> {
                                  val i = call.argument<Int>("index") ?: -1
                                  result.success(s?.tapNode(i) ?: false)
                              }
                              "swipe" -> {
                                  val x1 = (call.argument<Double>("x1") ?: 0.0).toFloat()
                                  val y1 = (call.argument<Double>("y1") ?: 0.0).toFloat()
                                  val x2 = (call.argument<Double>("x2") ?: 0.0).toFloat()
                                  val y2 = (call.argument<Double>("y2") ?: 0.0).toFloat()
                                  val d = (call.argument<Int>("durationMs") ?: 300).toLong()
                                  result.success(s?.gesture(x1, y1, x2, y2, d) ?: false)
                              }
                              "back" -> result.success(
                                  s?.performGlobalAction(android.accessibilityservice.AccessibilityService.GLOBAL_ACTION_BACK) ?: false)
                              "home" -> result.success(
                                  s?.performGlobalAction(android.accessibilityservice.AccessibilityService.GLOBAL_ACTION_HOME) ?: false)
                              "type" -> {
                                  val t = call.argument<String>("text") ?: ""
                                  val i = call.argument<Int>("nodeIndex") ?: -1
                                  result.success(s?.typeText(t, i) ?: false)
                              }
                              "isKillSwitchActive" -> result.success(JarvisAccessibilityService.killed)
                              "resetKillSwitch" -> {
                                  JarvisAccessibilityService.killed = false
                                  result.success(true)
                              }
                              "killSwitch" -> {
                                  JarvisAccessibilityService.killed = true
                                  result.success(true)
                              }
                              "startForegroundService" -> result.success(true)
                              "stopForegroundService" -> result.success(true)
                              "openAccessibility" -> {
                                  val i = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(i)
                                  result.success(true)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          EOF

      - name: Write lib/main.dart
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_secure_storage/flutter_secure_storage.dart';
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:http/http.dart' as http;
          import 'package:speech_to_text/speech_to_text.dart';

          void main() => runApp(const JarvisApp());

          class JarvisApp extends StatelessWidget {
            const JarvisApp({super.key});
            @override
            Widget build(BuildContext context) => MaterialApp(
              title: 'Jarvis',
              theme: ThemeData.dark(useMaterial3: true),
              home: const HomeScreen(),
            );
          }

          class NativeBridge {
            static const _ch = MethodChannel('jarvis/native');
            static Future<String> getUiTree() async =>
                await _ch.invokeMethod<String>('getUiTree') ?? '[]';
            static Future<Shot> captureScreenshot() async {
              final m = await _ch.invokeMapMethod<String, dynamic>('captureScreenshot');
              if (m == null) throw Exception('Screenshot failed');
              return Shot(
                base64: m['base64'] as String,
                iw: m['imageWidth'] as int, ih: m['imageHeight'] as int,
                sw: m['screenWidth'] as int, sh: m['screenHeight'] as int,
              );
            }
            static Future<bool> tap(double x, double y) async =>
                await _ch.invokeMethod<bool>('tap', {'x': x, 'y': y}) ?? false;
            static Future<bool> tapNode(int i) async =>
                await _ch.invokeMethod<bool>('tapNode', {'index': i}) ?? false;
            static Future<bool> swipe(double a, double b, double c, double d) async =>
                await _ch.invokeMethod<bool>('swipe',
                  {'x1': a, 'y1': b, 'x2': c, 'y2': d, 'durationMs': 300}) ?? false;
            static Future<bool> back() async =>
                await _ch.invokeMethod<bool>('back') ?? false;
            static Future<bool> home() async =>
                await _ch.invokeMethod<bool>('home') ?? false;
            static Future<bool> type(String t, {int idx = -1}) async =>
                await _ch.invokeMethod<bool>('type', {'text': t, 'nodeIndex': idx}) ?? false;
            static Future<bool> isKilled() async =>
                await _ch.invokeMethod<bool>('isKillSwitchActive') ?? true;
            static Future<void> resetKill() async =>
                _ch.invokeMethod('resetKillSwitch');
            static Future<void> kill() async =>
                _ch.invokeMethod('killSwitch');
            static Future<void> startFGS() async =>
                _ch.invokeMethod('startForegroundService');
            static Future<void> stopFGS() async =>
                _ch.invokeMethod('stopForegroundService');
            static Future<void> openAccessibility() async =>
                _ch.invokeMethod('openAccessibility');
          }

          class Shot {
            final String base64;
            final int iw, ih, sw, sh;
            Shot({required this.base64, required this.iw, required this.ih,
                 required this.sw, required this.sh});
            double get sx => sw / iw;
            double get sy => sh / ih;
          }

          class JarvisAction {
            final String summary, action, reason, risk, spoken;
            final int? tIndex;
            final double? x, y, ex, ey;
            final String? text, confirmQ;
            JarvisAction({
              required this.summary, required this.action, required this.reason,
              required this.risk, required this.spoken,
              this.tIndex, this.x, this.y, this.ex, this.ey, this.text, this.confirmQ,
            });
            factory JarvisAction.from(Map<String, dynamic> j) {
              final t = j['target'] as Map?;
              final e = j['end'] as Map?;
              return JarvisAction(
                summary: j['screen_summary'] ?? '',
                action: j['action'] ?? 'done',
                reason: j['action_reason'] ?? '',
                risk: j['risk'] ?? 'none',
                spoken: j['spoken_response'] ?? '',
                tIndex: j['target_index'] as int?,
                x: (t?['x'] as num?)?.toDouble(),
                y: (t?['y'] as num?)?.toDouble(),
                ex: (e?['x'] as num?)?.toDouble(),
                ey: (e?['y'] as num?)?.toDouble(),
                text: j['text'] as String?,
                confirmQ: j['confirm_question'] as String?,
              );
            }
            bool get needsConfirm => action == 'ask_confirmation' || risk == 'high';
          }

          class Gemini {
            final String apiKey, model, lang;
            Gemini({required this.apiKey, this.model = 'gemini-2.5-flash',
                    this.lang = 'hi-IN'});
            Future<JarvisAction> decide({
              required String goal, required Shot? screenshot,
              required String tree, required List<String> history,
            }) async {
              final langName = {'en-US':'English','hi-IN':'Hindi','or-IN':'Odia'}[lang] ?? 'Hindi';
              final prompt = '''You are Jarvis, an Android UI automation agent.
          USER GOAL: "$goal"
          RESPOND IN: $langName (screen_summary + spoken_response)
          UI TREE: $tree
          HISTORY: ${history.isEmpty ? "(none)" : history.join(" | ")}
          RULES:
          1. Prefer "target_index" over coordinates.
          2. Coordinates in IMAGE space.
          3. risk="high" for money/password/delete/send/settings.
          4. action="ask_confirmation" if unsure.
          5. action="done" only when goal achieved.
          Return ONLY valid JSON.''';
              final parts = <Map<String, dynamic>>[{'text': prompt}];
              if (screenshot != null) parts.add({
                'inline_data': {'mime_type': 'image/jpeg', 'data': screenshot.base64}
              });
              final body = {
                'contents': [{'role':'user','parts':parts}],
                'generationConfig': {
                  'responseMimeType': 'application/json',
                  'responseSchema': _schema,
                  'temperature': 0.1,
                }
              };
              final url = Uri.parse(
                'https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent?key=$apiKey');
              final resp = await http.post(url,
                headers: {'Content-Type': 'application/json'},
                body: jsonEncode(body),
              ).timeout(const Duration(seconds: 30));
              if (resp.statusCode != 200) {
                throw Exception('Gemini ${resp.statusCode}: ${resp.body}');
              }
              final text = jsonDecode(resp.body)['candidates'][0]['content']['parts'][0]['text'];
              return JarvisAction.from(jsonDecode(text));
            }

            static const _schema = {
              'type': 'object',
              'properties': {
                'screen_summary': {'type': 'STRING'},
                'action': {'type': 'STRING', 'enum':
                  ['tap','type','swipe','back','home','ask_confirmation','done']},
                'action_reason': {'type': 'STRING'},
                'target_index': {'type': 'INTEGER'},
                'target': {'type': 'OBJECT', 'properties':
                  {'x': {'type': 'NUMBER'}, 'y': {'type': 'NUMBER'}}},
                'end': {'type': 'OBJECT', 'properties':
                  {'x': {'type': 'NUMBER'}, 'y': {'type': 'NUMBER'}}},
                'text': {'type': 'STRING'},
                'risk': {'type': 'STRING', 'enum': ['none','low','high']},
                'confirm_question': {'type': 'STRING'},
                'spoken_response': {'type': 'STRING'},
              },
              'required': ['screen_summary','action','action_reason','risk','spoken_response'],
            };
          }

          enum TType { observe, action, warn, result }
          class TEntry {
            final TType type;
            final String title, detail;
            TEntry(this.type, this.title, this.detail);
          }

          class AgentLoop {
            final Gemini gemini;
            final void Function(TEntry) onT;
            final Future<void> Function(String) onSpeak;
            final Future<bool> Function(String) onConfirm;
            AgentLoop({required this.gemini, required this.onT,
                       required this.onSpeak, required this.onConfirm});

            Future<void> run(String goal, {int maxSteps = 15}) async {
              await NativeBridge.resetKill();
              await NativeBridge.startFGS();
              final history = <String>[];
              String? lastSig;
              int sameCount = 0;

              try {
                for (int step = 1; step <= maxSteps; step++) {
                  if (await NativeBridge.isKilled()) {
                    onT(TEntry(TType.warn, 'Stopped', 'Kill switch'));
                    await onSpeak('Rok diya gaya.');
                    return;
                  }
                  Shot? shot;
                  try { shot = await NativeBridge.captureScreenshot(); } catch (_) {}
                  final tree = await NativeBridge.getUiTree();

                  final sig = '${shot?.base64.hashCode ?? 0}_${tree.hashCode}';
                  if (sig == lastSig) {
                    sameCount++;
                    if (sameCount >= 2) {
                      onT(TEntry(TType.warn, 'No change', 'Screen same, ruk raha hoon'));
                      await onSpeak('Screen nahi badal rahi.');
                      return;
                    }
                  } else { sameCount = 0; }
                  lastSig = sig;

                  JarvisAction action;
                  try {
                    action = await gemini.decide(
                      goal: goal,
                      screenshot: (step == 1 || sameCount == 0) ? shot : null,
                      tree: tree, history: history,
                    );
                  } catch (e) {
                    onT(TEntry(TType.warn, 'Gemini error', e.toString()));
                    await onSpeak('Model se jawab nahi mila.');
                    return;
                  }

                  onT(TEntry(TType.observe, 'Step $step', action.summary));
                  if (await NativeBridge.isKilled()) {
                    await onSpeak('Rok diya gaya.');
                    return;
                  }

                  if (action.needsConfirm) {
                    onT(TEntry(TType.warn, 'Confirm', action.confirmQ ?? '?'));
                    final ok = await onConfirm(action.confirmQ ?? 'Aage badhein?');
                    if (!ok) { await onSpeak('Cancel kiya.'); return; }
                  }

                  final done = await _exec(action, shot);
                  history.add('$step:${action.action} - ${action.reason}');
                  onT(TEntry(TType.action, 'Step $step: ${action.action}', action.reason));

                  if (done) {
                    onT(TEntry(TType.result, 'Done', action.spoken));
                    await onSpeak(action.spoken);
                    return;
                  }
                  await Future.delayed(const Duration(milliseconds: 500));
                }
                onT(TEntry(TType.warn, 'Max steps', 'Kaam poora nahi hua'));
                await onSpeak('Maximum steps ho gaye.');
              } finally {
                await NativeBridge.stopFGS();
              }
            }

            Future<bool> _exec(JarvisAction a, Shot? s) async {
              double? sx, sy, ex, ey;
              if (a.x != null && a.y != null) {
                sx = a.x! * (s?.sx ?? 1); sy = a.y! * (s?.sy ?? 1);
              }
              if (a.ex != null && a.ey != null) {
                ex = a.ex! * (s?.sx ?? 1); ey = a.ey! * (s?.sy ?? 1);
              }
              switch (a.action) {
                case 'tap':
                  if (a.tIndex != null) {
                    await NativeBridge.tapNode(a.tIndex!);
                    return false;
                  }
                  if (sx == null) return false;
                  await NativeBridge.tap(sx, sy!);
                  return false;
                case 'type':
                  if (a.text == null) return false;
                  await NativeBridge.type(a.text!, idx: a.tIndex ?? -1);
                  return false;
                case 'swipe':
                  if (sx == null || ex == null) return false;
                  await NativeBridge.swipe(sx, sy!, ex, ey!);
                  return false;
                case 'back': await NativeBridge.back(); return false;
                case 'home': await NativeBridge.home(); return false;
                case 'done': return true;
                default: return false;
              }
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final _storage = const FlutterSecureStorage();
            final _tts = FlutterTts();
            final _stt = SpeechToText();
            final _goal = TextEditingController();
            final _entries = <TEntry>[];

            String _lang = 'hi-IN';
            String? _key;
            bool _running = false, _listening = false;

            @override
            void initState() { super.initState(); _loadKey(); }

            Future<void> _loadKey() async {
              final k = await _storage.read(key: 'gemini_key');
              setState(() => _key = k);
              if (k == null && mounted) _askKey();
            }

            Future<void> _askKey() async {
              final c = TextEditingController(text: _key ?? '');
              final r = await showDialog<String>(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('Gemini API Key'),
                  content: TextField(controller: c, decoration: const InputDecoration(hintText: 'AIza...')),
                  actions: [TextButton(onPressed: () => Navigator.pop(ctx, c.text.trim()), child: const Text('Save'))],
                ),
              );
              if (r != null && r.isNotEmpty) {
                await _storage.write(key: 'gemini_key', value: r);
                setState(() => _key = r);
              }
            }

            Future<void> _voice() async {
              final ok = await _stt.initialize();
              if (!ok) return;
              setState(() => _listening = true);
              await _stt.listen(
                localeId: _lang,
                onResult: (r) {
                  setState(() => _goal.text = r.recognizedWords);
                  if (r.finalResult) {
                    setState(() => _listening = false);
                    _run();
                  }
                },
              );
            }

            Future<bool> _confirm(String q) async {
              final r = await showDialog<bool>(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => AlertDialog(
                  title: const Text('Confirm'),
                  content: Text(q),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx, false), child: const Text('No')),
                    TextButton(onPressed: () => Navigator.pop(ctx, true), child: const Text('Yes')),
                  ],
                ),
              );
              return r ?? false;
            }

            Future<void> _run() async {
              final goal = _goal.text.trim();
              if (goal.isEmpty || _key == null || _running) return;
              setState(() { _running = true; _entries.clear(); });
              await _tts.setLanguage(_lang);
              final loop = AgentLoop(
                gemini: Gemini(apiKey: _key!, lang: _lang),
                onT: (e) { if (mounted) setState(() => _entries.insert(0, e)); },
                onSpeak: (t) async { await _tts.speak(t); },
                onConfirm: _confirm,
              );
              try {
                await loop.run(goal);
              } finally {
                if (mounted) setState(() => _running = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Jarvis'),
                  actions: [
                    IconButton(icon: const Icon(Icons.vpn_key), onPressed: _askKey),
                    IconButton(icon: const Icon(Icons.accessibility_new), onPressed: NativeBridge.openAccessibility),
                    PopupMenuButton<String>(
                      initialValue: _lang,
                      onSelected: (v) => setState(() => _lang = v),
                      itemBuilder: (_) => const [
                        PopupMenuItem(value: 'hi-IN', child: Text('Hindi')),
                        PopupMenuItem(value: 'en-US', child: Text('English')),
                        PopupMenuItem(value: 'or-IN', child: Text('Odia')),
                      ],
                    ),
                  ],
                ),
                body: Padding(
                  padding: const EdgeInsets.all(12),
                  child: Column(
                    children: [
                      TextField(
                        controller: _goal,
                        decoration: const InputDecoration(
                          hintText: 'Kya karna hai?',
                          border: OutlineInputBorder(),
                        ),
                      ),
                      const SizedBox(height: 8),
                      Row(
                        children: [
                          Expanded(
                            child: FilledButton(
                              onPressed: _running ? null : _run,
                              child: Text(_running ? 'Chal raha hai...' : 'Start'),
                            ),
                          ),
                          const SizedBox(width: 8),
                          IconButton.filled(
                            onPressed: _running ? null : _voice,
                            icon: Icon(_listening ? Icons.mic : Icons.mic_none),
                          ),
                          const SizedBox(width: 8),
                          IconButton.filled(
                            style: IconButton.styleFrom(backgroundColor: Colors.red),
                            onPressed: NativeBridge.kill,
                            icon: const Icon(Icons.stop),
                          ),
                        ],
                      ),
                      const SizedBox(height: 8),
                      Expanded(
                        child: ListView.builder(
                          itemCount: _entries.length,
                          itemBuilder: (_, i) {
                            final e = _entries[i];
                            return ListTile(
                              dense: true,
                              title: Text(e.title),
                              subtitle: Text(e.detail),
                            );
                          },
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Install packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
