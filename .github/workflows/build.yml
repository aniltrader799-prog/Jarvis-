name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix Kotlin version
        run: |
          for f in android/settings.gradle android/settings.gradle.kts; do
            [ -f "$f" ] && sed -i -E 's/(kotlin\.android"\)? *version *")[0-9]+\.[0-9]+\.[0-9]+"/\12.2.20"/' "$f"
          done
          [ -f android/build.gradle ] && sed -i -E "s/ext\.kotlin_version *= *'[0-9.]+'/ext.kotlin_version = '2.2.20'/" android/build.gradle
          grep -rn "kotlin" android/settings.gradle* android/build.gradle* || true

      - name: Install packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
